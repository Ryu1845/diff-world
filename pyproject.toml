[project]
name = "diff-world"
version = "0.1.0"
description = "Differentiable WORLD synthesizer-based neural vocoder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pyworld>=0.3.4", "pytest>=8"]
